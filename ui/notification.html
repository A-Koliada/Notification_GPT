<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification</title>
  <link rel="stylesheet" href="notification.css">
</head>
<body>
  <div class="notification-container" id="notificationRoot">
    <button class="close-btn" id="closeBtn" title="Close">&times;</button>

    <div class="notification-header">
      <span class="notification-type" id="notifType"></span>
      <span class="notification-time" id="notifTime"></span>
    </div>

    <div class="notification-main" id="notifBody">
      <div class="notification-title" id="notifTitle">Notification</div>
      <div class="notification-message" id="notifMessage">Loading...</div>
    </div>

    <div class="visa-section" id="visaSection" style="display: none;">
      <label class="visa-label" for="visaSelect">Visa Decision</label>
      <select class="visa-select" id="visaSelect"></select>
    </div>

    <div class="notification-actions">
      <button class="action-btn delete" id="deleteBtn" title="Delete">🗑️</button>
      <button class="action-btn confirm" id="doneBtn" title="Mark as read">✅</button>
    </div>

    <div class="timer-bar" id="timerBar"></div>
  </div>

  <script src="notification.js"></script>
</body>
</html>
